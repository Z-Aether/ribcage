# The stack Komodo runs (#40). Locally it runs with compose.local.yaml on top, as CLAUDE.md says.
name: ribcage

services:
  ribcage:
    # A pinned tag, never latest: rolling back is editing this line, which the backup sidecar shares through the anchor.
    # Komodo's auto-update stays off (#40).
    image: &pinned registry.brabulla.xyz:5050/z-aether/ribcage_deploy/ribcage:20261017-1353-888a02a
    restart: unless-stopped
    # Real values go in the Komodo stack's environment; an empty required one stops startup, naming it (#18, #45).
    environment:
      SECRET_KEY: ${SECRET_KEY:-}
      DEBUG: "false"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      DATABASE_PATH: /data/db.sqlite3
      TIME_ZONE: ${TIME_ZONE:-}
      JOIN_CODE: ${JOIN_CODE:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      DTDD_API_KEY: ${DTDD_API_KEY:-}
      # Judgement constants: left empty, each keeps its default (#25).
      DIVERSITY_CUT: ${DIVERSITY_CUT:-}
      FLOOR_WEIGHT_MULTIPLIER: ${FLOOR_WEIGHT_MULTIPLIER:-}
      BATCH_SIZE: ${BATCH_SIZE:-}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-}
      TRIGGER_ICON_THRESHOLD: ${TRIGGER_ICON_THRESHOLD:-}
      LOGIN_BACKOFF_FAILURES: ${LOGIN_BACKOFF_FAILURES:-}
      LOGIN_BACKOFF_WINDOW_MINUTES: ${LOGIN_BACKOFF_WINDOW_MINUTES:-}
      LOGIN_BACKOFF_WAIT_MINUTES: ${LOGIN_BACKOFF_WAIT_MINUTES:-}
    volumes:
      - data:/data
    # The host's proxy runs in host networking and forwards to 8080; loopback alone keeps it the only way in,
    # which is what makes X-Forwarded-Proto trustworthy (#31, #54).
    ports:
      - 127.0.0.1:8080:8000
    # Logs sit on the host's disk until the container is removed, so they are capped (#16).
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # One backup a night onto its own volume, keeping 7; it needs nothing from the host but that volume (#18, #30, #53).
  backup:
    image: *pinned
    restart: unless-stopped
    # Replaces the image's command, so the sidecar neither migrates nor serves.
    command: ["python", "-m", "ribcage.operations.backup", "nightly"]
    # The backup hour is in the deployment's zone, and that is all it is handed: no secrets.
    environment:
      TIME_ZONE: ${TIME_ZONE:-}
    volumes:
      # Read-write even so, because a WAL reader writes the -shm file beside the database.
      - data:/data
      - backups:/backups
    network_mode: none
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  # The SQLite database, in WAL mode (#14, #18).
  data:
  # The backup sidecar's 7 newest backups; teardown removes it along with data (#30).
  backups:
