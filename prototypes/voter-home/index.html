<!doctype html>
<!--
  PROTOTYPE — ticket #27, the voter home. Throwaway. Not production.

  Where a voter lands, what they see in each phase, and what the pool of
  suggestions looks like. Three variants of the VOTER SHELL, switchable via
  ?variant=A|B|C and the floating bar; the bar's phase switch walks each one
  through SUGGEST → APPROVE → VOTE → PICK → RUN.

    A  One page      the page IS the phase: a thin header, and the body is whatever
                     the phase is (pool / ballot / reveal / evening). Status in one
                     sentence in the header; the nag is a slim bar under it; the
                     done roster lives in the header in VOTE (as #9 drew it). Late
                     suggestions in VOTE are one header link away.
    B  Tabs          one tab per surface that exists so far — Films, Ballot, Scores,
                     Evening, My warnings — the current phase's tab marked "now" and
                     opened by default. The Films tab is grouped by who suggested
                     what, and from APPROVE on it says what happened to each film.
                     The nag is only a dot on the warnings tab; the done roster is
                     its own strip on the Ballot tab.
    C  Home          a hub you land on: what's happening, what comes next, what YOU
                     still have to do (the nag is one of those to-dos), your own
                     suggestions and the done roster. Every surface — the pool, the
                     ballot, the scores, the evening — is its own page one click away.

  Fixed by earlier tickets and not up for grabs here: the collapsed film card IS the
  pool row and expands in place (#21); the Suggest-a-film panel sits above the pool
  and a new film lands on top (#21); the ballot is a full-width tier list with a thin
  header (#9); the voter's PICK body is the reveal matrix (#29); RUN is the
  timetable, read-only (#13); "My warnings" is reachable in every phase but RUN
  (#23); scores are hidden entirely during VOTE (#8); only SUGGEST and VOTE are
  writable, and a voter is shown no door rather than told no (#15); voter-facing
  surfaces are rounded and roomy (map principle, #29). The ballot, the reveal, the
  evening and the warnings page are STAND-INS here — enough to judge the shell
  around them, not redesigns of them.

  Data is real (data.js): the #29 prototype's 32 candidates, nine voters, notes and
  scores, plus three films from the #21 prototype — two long ones the admin drops in
  APPROVE and one late suggestion that lands mid-VOTE. The Suggest panel's search is
  a lookup against #21's recorded TMDB results (try "dune", "evil dead 2013",
  "urban legend"). "You" are Dani.

  Round 2 (2026-09-29). Dev: A wins — "mostly one screen per phase"; B and C
  overcomplicate it; the nag bar is not too loud; the header roster is enough.
  Simplicity is the driving principle. Changes, shown on A only (B and C are kept
  as the losing options and only run, they were not revised):
    - suggesting, withdrawing and editing the runtime happen in SUGGEST only; in
      APPROVE the list is frozen and in VOTE it is not shown — the ballot is the
      whole page. Late suggestions are not a feature (amends #15).
    - notes stay editable while the list is reachable (SUGGEST, APPROVE).
    - APPROVE shows nothing of the admin's decisions; the result is the ballot.
    - the nag shows until the reveal (SUGGEST, APPROVE, VOTE); My warnings stays
      reachable through PICK, since the reveal opens the card (#29).
    - PICK is the reveal; RUN is the evening with the reveal as a secondary view,
      one header link away (amends #13's single page).

  Resolved on this state, 2026-09-29: A — one page per phase — is the voter home.
  A stale suggestion posted during APPROVE still lands; from VOTE on the suggest
  endpoint rejects it and reloads the tab (a second guard beside #15's vote one).
  #9's "no note box on the VOTE card" stands; notes are written in SUGGEST and
  APPROVE only. B (tabs) and C (home hub) stay as the losing options, at round 1.

  Run:  python -m http.server 8027   →  http://localhost:8027/prototypes/voter-home/?variant=A
        (or just open this file — everything is inline)
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Voter home (prototype #27)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg:#f6f5f2; --panel:#fff; --ink:#1c1b19; --mute:#6b6963; --line:#dcd9d2; --line2:#ece9e2;
    --acc:#2f5fd0; --acc2:#e8eefc; --warn:#b3261e; --warn2:#fbeae8; --ok:#2b7a3d; --ok2:#e6f2e8;
    --amb:#8a5a00; --amb2:#fff6dc;
    --s3:#1e6b34; --s2:#4b9a5c; --s1:#a5d3a7; --s0:#d9d7d0; --sm1:#e9a35c; --sv:#c8443a;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 system-ui, "Segoe UI", Roboto, sans-serif; }
  button { font:inherit; cursor:pointer; border:1px solid var(--line); background:#fff; border-radius:999px; padding:5px 14px; color:var(--ink); }
  button:hover { border-color:#b9b5aa; }

  button.small { padding:2px 10px; font-size:12px; }
  input, textarea { font:inherit; border:1px solid var(--line); border-radius:10px; padding:8px 12px; background:#fff; color:var(--ink); }
  a { color:var(--acc); text-decoration:none; cursor:pointer; }
  a:hover { text-decoration:underline; }
  .mute { color:var(--mute); } .small { font-size:12px; } .tn { font-variant-numeric:tabular-nums; }
  .grow { flex:1; }

  /* ---------- shell pieces ---------- */
  header.app { display:flex; align-items:center; gap:14px; padding:10px 22px; background:#fff; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:6; flex-wrap:wrap; }
  header.app .brand { font-weight:800; letter-spacing:.02em; font-size:15px; }
  .phase { background:var(--acc2); color:var(--acc); border-radius:999px; padding:2px 10px; font-size:11px; font-weight:700; letter-spacing:.05em; }
  header.app .status { color:var(--mute); }
  .me { display:inline-flex; align-items:center; gap:6px; color:var(--mute); }
  .av { display:inline-flex; align-items:center; justify-content:center; width:28px; height:28px; border-radius:50%; font-weight:700; font-size:12px; color:#2a2a2a; flex:none; position:relative; }
  .av.sm { width:22px; height:22px; font-size:10px; }
  .av.lg { width:40px; height:40px; font-size:15px; }
  .av .tick { position:absolute; right:-4px; bottom:-4px; width:15px; height:15px; border-radius:50%; background:var(--ok); color:#fff; font-size:9px; line-height:15px; text-align:center; border:2px solid #fff; }

  /* B: tabs */
  nav.tabs { display:flex; gap:4px; padding:0 22px; background:#fff; border-bottom:1px solid var(--line); position:sticky; top:49px; z-index:5; overflow-x:auto; }
  nav.tabs a { padding:10px 16px; color:var(--mute); border-bottom:3px solid transparent; white-space:nowrap; font-weight:600; text-decoration:none; position:relative; }
  nav.tabs a.on { color:var(--ink); border-bottom-color:var(--acc); }
  nav.tabs .now { font-size:10px; background:var(--acc); color:#fff; border-radius:999px; padding:0 6px; margin-left:6px; vertical-align:1px; }
  nav.tabs .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#e0a100; margin-left:6px; vertical-align:1px; }
  .rosterstrip { display:flex; align-items:center; gap:14px; background:#fff; border:1px solid var(--line); border-radius:16px; padding:10px 16px; margin:0 0 14px; flex-wrap:wrap; }
  .rosterstrip .who { display:inline-flex; flex-direction:column; align-items:center; gap:2px; font-size:11px; color:var(--mute); width:48px; }
  .group h3 { margin:22px 0 8px; font-size:14px; display:flex; gap:8px; align-items:center; }
  .fate { font-size:11px; border-radius:999px; padding:1px 9px; font-weight:600; white-space:nowrap; }
  .fate.approved { background:var(--ok2); color:var(--ok); }
  .fate.dropped { background:var(--line2); color:var(--mute); }
  .fate.pending { background:var(--amb2); color:var(--amb); }

  /* C: hub */
  .hero { background:#fff; border:1px solid var(--line); border-radius:22px; padding:26px 30px; margin:0 0 18px; }
  .hero h1 { margin:0 0 6px; font-size:26px; }
  .hero p { margin:0 0 16px; color:var(--mute); font-size:15px; max-width:760px; }
  .steps { display:flex; gap:0; align-items:center; margin:0 0 18px; flex-wrap:wrap; }
  .steps .st { display:flex; align-items:center; gap:8px; color:#a19e96; font-weight:600; font-size:12px; letter-spacing:.04em; }
  .steps .st .b { width:14px; height:14px; border-radius:50%; border:2px solid var(--line); background:#fff; }
  .steps .st.past { color:var(--mute); } .steps .st.past .b { background:var(--mute); border-color:var(--mute); }
  .steps .st.cur { color:var(--acc); } .steps .st.cur .b { background:var(--acc); border-color:var(--acc); box-shadow:0 0 0 4px var(--acc2); }
  .steps .ln { width:48px; height:2px; background:var(--line); margin:0 10px; }
  .todos { display:grid; grid-template-columns:repeat(auto-fill, minmax(290px, 1fr)); gap:14px; margin:0 0 18px; }
  .todo { background:#fff; border:1px solid var(--line); border-radius:18px; padding:16px 18px; display:flex; flex-direction:column; gap:8px; }
  .todo h4 { margin:0; font-size:15px; }
  .todo.amb { background:var(--amb2); border-color:#f0dfa0; }
  .todo .acts { display:flex; gap:8px; flex-wrap:wrap; margin-top:auto; }
  .todo ul { margin:0; padding:0; list-style:none; }
  .todo li { display:flex; gap:8px; align-items:center; padding:3px 0; }
  .crumb { margin:0 0 14px; }

  /* ---------- the shared film card (#21), collapsed = the pool row ---------- */
  .pool { display:flex; flex-direction:column; gap:10px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:16px; padding:12px 14px; display:flex; gap:14px; align-items:flex-start; }
  .card.new { box-shadow:0 0 0 3px #b9ccf5; }
  .card img.po { width:62px; height:93px; border-radius:8px; object-fit:cover; background:var(--line2); flex:none; }
  .card .body { flex:1; min-width:0; }
  .card .t1 { display:flex; gap:8px; align-items:baseline; flex-wrap:wrap; }
  .card .t1 .ti { font-weight:700; font-size:15px; cursor:pointer; }
  .card .t2 { display:flex; gap:12px; align-items:center; flex-wrap:wrap; color:var(--mute); font-size:13px; margin-top:2px; }
  .icon { display:inline-block; width:16px; height:16px; border-radius:50%; background:var(--warn); color:#fff; font-size:11px; line-height:16px; text-align:center; font-weight:700; }
  .rtag { font-size:10px; border:1px solid var(--line); border-radius:999px; padding:0 6px; color:var(--mute); }
  .notes { margin-top:6px; display:flex; flex-direction:column; gap:3px; }
  .note { font-size:13px; display:flex; gap:6px; align-items:baseline; }
  .note b { white-space:nowrap; }
  .note.pitch { color:var(--ink); }
  .note:not(.pitch) { color:#4a4843; }
  .card .side { display:flex; flex-direction:column; gap:6px; align-items:flex-end; }
  .card .more { margin-top:10px; border-top:1px solid var(--line2); padding-top:10px; display:flex; flex-direction:column; gap:8px; font-size:13px; }
  .card .more textarea { width:100%; min-height:54px; }
  .matched { color:var(--warn); }
  details summary { cursor:pointer; color:var(--mute); }
  .topics { columns:3 220px; font-size:12px; margin-top:6px; }
  .topics div { break-inside:avoid; }

  /* ---------- the Suggest-a-film panel (#21, flow settled; only its place is in question) ---------- */
  .suggest { background:#fff; border:1px solid var(--line); border-radius:18px; padding:14px 16px; margin:0 0 16px; }
  .suggest .row1 { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  .suggest .row1 input { flex:1; min-width:220px; }
  .tiles { display:flex; gap:12px; margin-top:12px; flex-wrap:wrap; }
  .tiles .tl { width:120px; cursor:pointer; text-align:center; font-size:12px; }
  .tiles .tl img { width:120px; height:180px; object-fit:cover; border-radius:10px; background:var(--line2); display:block; margin-bottom:4px; }
  .tiles .tl:hover img { outline:3px solid var(--acc); }
  .pitchstep { display:flex; gap:16px; margin-top:12px; flex-wrap:wrap; }
  .pitchstep textarea { flex:1; min-width:260px; min-height:90px; }
  .poolhead { display:flex; gap:10px; align-items:center; margin:0 0 10px; flex-wrap:wrap; }
  .poolhead h2 { margin:0; font-size:17px; }
  .chipf { border-radius:999px; padding:3px 12px; border:1px solid var(--line); background:#fff; cursor:pointer; font-size:13px; }
  .chipf.on { background:var(--ink); color:#fff; border-color:var(--ink); }

  /* ---------- stand-ins ---------- */
  .tray { position:sticky; background:#fff; border:1px solid var(--line); border-radius:16px; padding:10px 12px; margin:0 0 12px; z-index:4; }
  .band { display:flex; gap:10px; align-items:stretch; margin:0 0 8px; }
  .band .lab { width:110px; flex:none; border-radius:12px; padding:8px 10px; font-weight:700; font-size:13px; display:flex; flex-direction:column; justify-content:center; }
  .band .zone { flex:1; background:#fff; border:1px solid var(--line); border-radius:12px; padding:6px; display:flex; gap:6px; flex-wrap:wrap; min-height:118px; }
  .band.veto .zone { border:2px dashed var(--sv); }
  .tile { width:72px; text-align:center; font-size:10px; line-height:1.2; }
  .tile img { width:72px; height:106px; object-fit:cover; border-radius:6px; display:block; background:var(--line2); }
  .tile.ring img { outline:3px solid #e0a100; }
  .s3 { background:var(--s3); color:#fff; } .s2 { background:var(--s2); color:#fff; } .s1 { background:var(--s1); } .s0 { background:var(--s0); } .sm1 { background:var(--sm1); } .sv { background:var(--sv); color:#fff; }
  table.rev { width:100%; border-collapse:separate; border-spacing:0 6px; }
  table.rev th { font-size:12px; color:var(--mute); font-weight:600; padding:0 4px; }
  table.rev td { background:#fff; padding:6px 4px; text-align:center; border-top:1px solid var(--line2); border-bottom:1px solid var(--line2); }
  table.rev td:first-child { text-align:left; border-left:1px solid var(--line2); border-radius:12px 0 0 12px; padding-left:12px; }
  table.rev td:last-child { border-right:1px solid var(--line2); border-radius:0 12px 12px 0; }
  .pill { display:inline-flex; align-items:center; justify-content:center; width:40px; height:30px; border-radius:9px; font-weight:700; font-size:13px; }
  .pill.blank { border:2px dotted var(--line); }
  .evening { display:flex; flex-direction:column; gap:10px; max-width:760px; margin:0 auto; }
  .box { background:#fff; border:1px solid var(--line); border-radius:16px; padding:12px 16px; display:flex; gap:16px; align-items:center; }
  .box .tm { font-size:18px; font-weight:700; width:120px; font-variant-numeric:tabular-nums; }
  .box img { width:46px; height:69px; border-radius:6px; object-fit:cover; }
  .box.now { border:2px solid var(--acc); box-shadow:0 0 0 4px var(--acc2); }
  .box.past { opacity:.5; }
  .box.meal { background:var(--line2); }
  .warnlist { display:flex; flex-wrap:wrap; gap:8px; }
  .warnlist label { background:#fff; border:1px solid var(--line); border-radius:999px; padding:4px 12px; cursor:pointer; }
  .warnlist input { margin-right:6px; }

  /* ---------- prototype bar ---------- */
  .pbar { position:fixed; left:50%; bottom:14px; transform:translateX(-50%); background:#111; color:#eee; border-radius:14px; padding:6px 10px; display:flex; gap:10px; align-items:center; z-index:30; box-shadow:0 6px 24px rgba(0,0,0,.35); font-size:12px; flex-wrap:wrap; justify-content:center; max-width:96vw; }
  .pbar button { background:#2a2a2a; color:#eee; border:1px solid #444; border-radius:8px; padding:3px 9px; font-size:12px; }
  .pbar button.on { background:#eee; color:#111; }
  .pbar .lbl { font-weight:700; min-width:150px; text-align:center; }
  .pbar .grp { display:flex; gap:3px; align-items:center; }
  .pbar .grp span { color:#999; margin-right:4px; }
  .pbar.top { top:10px; bottom:auto; }
</style>
</head>
<body>
<div id="app"></div>
<div id="bar"></div>
<script src="data.js"></script>
<script>
const D = window.DATA, ME = D.me;
const PHASES = ['SUGGEST', 'APPROVE', 'VOTE', 'PICK', 'RUN'];
const VARIANTS = { A: 'One page', B: 'Tabs', C: 'Home' };
const qs = new URLSearchParams(location.search);
const S = {
  variant: VARIANTS[qs.get('variant')] ? qs.get('variant') : 'A',
  phase: PHASES.includes(qs.get('phase')) ? qs.get('phase') : 'SUGGEST',
  warn: 'none',            // none | set | dontcare  (#20/#23's nag fires on "none")
  watched: new Set(D.watched),
  trim: '120',             // full | 120 | pitch | none — #21's knob for forty cards
  route: null,             // variant-specific secondary page
  open: new Set(), filter: 'all',
  done: new Set(['Ana', 'Csilla', 'Feri', 'Gergő']),
  added: [], withdrawn: new Set(), myNotes: {}, rt: {},
  q: '', results: null, draft: null, justAdded: null, toast: null,
  barMin: false, barTop: false,
};
const LATE = 9877;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const po = p => p ? `https://image.tmdb.org/t/p/w185${p}` : '';
const pi = () => PHASES.indexOf(S.phase);
const HUES = { Ana: '#f4c7c3', Bence: '#c6dafc', Csilla: '#fce8b2', Dani: '#b7e1cd', Eszter: '#e1c9f5', Feri: '#f9d4b0', 'Gergő': '#c8e6f0', Hanna: '#f7c6de', 'Iván': '#d9d2c5' };
const av = (n, cls = '', tick = false) => `<span class="av ${cls}" style="background:${HUES[n] || '#ddd'}" title="${esc(n)}">${esc(n[0])}${tick ? '<span class="tick">✓</span>' : ''}</span>`;
const byMe = f => f.suggester === ME;

// ---------------------------------------------------------------- the world, by phase
function exists(f) { return !S.withdrawn.has(f.id) && f.id !== LATE; } // round 2: late suggestions are not a feature
function fate(f) { // what the admin has done with a suggestion, as of this phase
  if (f._added) return 'pending';
  if (f.id === LATE) return 'pending';
  if (S.phase === 'SUGGEST') return 'pending';
  if (S.phase === 'APPROVE') return f.fate === 'dropped' ? 'dropped' : f.order < 20 ? 'approved' : 'pending';
  return f.fate;
}
function suggestions() { return [...S.added, ...D.films].filter(exists); }
function ballot() { return D.films.filter(f => f.fate === 'approved'); }
const myScore = f => (f.order % 3 === 0 ? undefined : D.scores[ME][f.id]); // a half-sorted ballot: 21 of 32
function scored() { return ballot().filter(f => myScore(f) !== undefined || D.vetoes[ME][f.id] !== undefined).length; }
function matched(f) { if (S.warn !== 'set' || !f.dtdd) return []; return f.dtdd.topics.filter(t => S.watched.has(t.topic)); }
function hasIcon(f) { return matched(f).some(t => t.yes >= 5 && t.yes > t.no); }
function notesOf(f) { const n = { ...f.notes }; if (S.myNotes[f.id] !== undefined) { if (S.myNotes[f.id]) n[ME] = S.myNotes[f.id]; else delete n[ME]; } return Object.entries(n).sort((a, b) => (b[0] === f.suggester) - (a[0] === f.suggester)); }
const runtime = f => S.rt[f.id] ?? f.runtime;
const STATUS = {
  SUGGEST: 'Suggesting films — add anything you would like to watch. Nothing is decided yet.',
  APPROVE: 'The admin is choosing which films go to the vote. The list is closed.',
  VOTE: 'Voting — sort every film on your ballot. Nobody sees anyone’s scores until voting closes.',
  PICK: 'VOTE is closed · the admin is choosing the slate · everyone’s scores are open, by name',
  RUN: 'The plan is set. This is the evening.',
};

// ---------------------------------------------------------------- the shared card (#21), collapsed = the pool row
function trimmed(t) { return S.trim === '120' && t.length > 120 ? t.slice(0, 117) + '…' : t; }
function card(f, opts = {}) {
  const open = S.open.has(f.id), notes = notesOf(f), m = matched(f);
  const shown = S.trim === 'none' ? [] : S.trim === 'pitch' ? notes.slice(0, 1) : notes;
  const mine = byMe(f), fa = fate(f);
  const writable = S.phase === 'SUGGEST';                            // round 2: runtime and withdraw only while suggesting
  const noteable = S.phase === 'SUGGEST' || S.phase === 'APPROVE';  // round 2: notes stay open while the list is reachable
  return `<article class="card ${S.justAdded === f.id ? 'new' : ''}">
    <img class="po" src="${po(f.poster)}" alt="">
    <div class="body">
      <div class="t1">${hasIcon(f) ? '<span class="icon" title="a topic you watch for">!</span>' : ''}
        <span class="ti" onclick="tog(${f.id})">${esc(f.title)}</span><span class="mute">${f.year || ''}</span>
        <span class="mute small">${esc((f.director || []).join(', '))}${f.cert ? ' · ' + esc(f.cert) : ''}</span>
        <span class="small">${f.trailer ? `<a href="https://youtu.be/${f.trailer}" target="_blank">▶ Trailer</a> · ` : ''}<a href="https://www.themoviedb.org/movie/${f.id}" target="_blank">TMDB</a></span>
        ${opts.fate ? `<span class="fate ${fa}">${{ approved: 'On the ballot', dropped: 'Not this time', pending: 'Waiting for the admin' }[fa]}</span>` : ''}
      </div>

let deb;
function search(v) {
  S.q = v; clearTimeout(deb);
  deb = setTimeout(() => {
    const m = v.trim().match(/^(.*?)(?:\s+(\d{4}))?$/); const t = (m[1] || '').toLowerCase(), y = m[2];
    if (t.length < 2) { S.results = null; render(); focusQ(); return; }
    const key = Object.keys(D.searches).find(k => k.toLowerCase().startsWith(t) || t.startsWith(k.toLowerCase()));
    let rows = key ? D.searches[key].rows : [];

function pick(i) { const r = S.results[i], f = D.searchFilms[r.id] || {}; S.draft = { id: r.id, title: r.title, year: (r.release_date || '').slice(0, 4), poster: r.poster_path, runtime: f.runtime, director: f.director, cert: f.cert, trailer: f.trailer, dtdd: f.dtdd }; render(); }
function addDraft() {

}

// ---------------------------------------------------------------- the pool, three arrangements

}

// ---------------------------------------------------------------- stand-ins for settled surfaces

// ---------------------------------------------------------------- actions
function go(r) { S.route = r; if (r !== 'pool') S.filter = r === null ? S.filter : S.filter; render(); window.scrollTo(0, 0); }
function tog(id) { S.open.has(id) ? S.open.delete(id) : S.open.add(id); render(); }
function note(id, v) { S.myNotes[id] = v.trim(); render(); }
function editRt(id) { const f = [...S.added, ...D.films].find(x => x.id === id); const v = prompt(`Runtime of the copy we’ll watch (TMDB says ${f.tmdbRuntime || f.runtime} min)`, runtime(f)); if (v && +v > 0) { S.rt[id] = +v; render(); } }
function withdraw(id) { S.withdrawn.add(id); toast('Withdrawn', () => { S.withdrawn.delete(id); render(); }); render(); }
function watch(t, on) { if (S.warn !== 'set') { S.warn = 'set'; S.watched = new Set(); } on ? S.watched.add(t) : S.watched.delete(t); if (!S.watched.size) S.warn = 'none'; render(); }
function toggleDone() { S.done.has(ME) ? S.done.delete(ME) : S.done.add(ME); render(); }
let tt;

function render() {

  document.getElementById('app').innerHTML = html + (S.toast ? `<div class="toast">${esc(S.toast.text)}${S.toast.undo ? ` <a onclick="S.toast.undo();S.toast=null;render()">Undo</a>` : ''}</div>` : '');

}
function renderBar() {
  const b = document.getElementById('bar');
  if (S.barMin) { b.innerHTML = `<div class="pbar ${S.barTop ? 'top' : ''}"><button onclick="S.barMin=false;renderBar()">▸ ${S.variant} · ${S.phase}</button></div>`; return; }
  b.innerHTML = `<div class="pbar ${S.barTop ? 'top' : ''}">
    <button onclick="cycle(-1)">←</button><span class="lbl">${S.variant} — ${VARIANTS[S.variant]}</span><button onclick="cycle(1)">→</button>
    <span class="grp"><span>phase</span>${PHASES.map(p => `<button class="${S.phase === p ? 'on' : ''}" onclick="setPhase('${p}')">${p[0]}${p.slice(1).toLowerCase()}</button>`).join('')}</span>
    <span class="grp"><span>warnings</span>${[['none', 'not set'], ['set', 'set'], ['dontcare', 'don’t care']].map(([k, l]) => `<button class="${S.warn === k ? 'on' : ''}" onclick="S.warn='${k}';if(S.warn==='set'&&!S.watched.size)S.watched=new Set(D.watched);render()">${l}</button>`).join('')}</span>
    <span class="grp"><span>notes</span>${[['full', 'full'], ['120', '120'], ['pitch', 'pitch'], ['none', 'none']].map(([k, l]) => `<button class="${S.trim === k ? 'on' : ''}" onclick="S.trim='${k}';render()">${l}</button>`).join('')}</span>
    <button title="move the bar" onclick="S.barTop=!S.barTop;renderBar()">${S.barTop ? '⤓' : '⤒'}</button><button onclick="S.barMin=true;renderBar()">▾</button></div>`;
}
function syncUrl() { const u = new URL(location); u.searchParams.set('variant', S.variant); u.searchParams.set('phase', S.phase); history.replaceState(null, '', u); }
function cycle(d) { const k = Object.keys(VARIANTS); S.variant = k[(k.indexOf(S.variant) + d + k.length) % k.length]; S.route = null; S.draft = null; S.results = null; syncUrl(); render(); }
function setPhase(p) { S.phase = p; S.route = null; S.draft = null; S.results = null; syncUrl(); render(); }
document.addEventListener('keydown', e => { if (e.target.closest('input,textarea,[contenteditable]')) return; if (e.key === 'ArrowLeft') cycle(-1); if (e.key === 'ArrowRight') cycle(1); });
syncUrl(); render();
</script>
</body>
</html>
