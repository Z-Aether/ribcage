<!doctype html>
<!--
  PROTOTYPE — ticket #28, the admin console. Throwaway. Not production.

  Where the admin lands, how they move the phase, what the approve screen looks
  like, and the roster's three jobs. Three variants of the ADMIN SHELL, switchable
  via ?variant=A|B|C and the floating bar; the bar's "start at" buttons load the
  world as it would be at each phase, and the phase control itself then moves the
  pointer live, both ways.

    A  Tabs + rail     persistent dark admin header carrying the phase rail with
                       one-step-back / one-step-forward buttons; a move opens a
                       confirm strip under the header saying what it does. Tabs
                       under it — Films · Pick · Roster — land on the current
                       phase's tool but stay put when the phase moves. The approve
                       screen is a DENSE LEDGER: one row per suggestion, runtime box
                       and Approve/Drop inline, the title expanding the row into the
                       shared card's detail.
    B  Console page    a home page you land on: the phase is a card of its own with
                       both possible moves and their consequences always printed,
                       one click each; below it one line per tool with its numbers.
                       Each tool is a page one click away. The approve screen is
                       #27's POOL OF SHARED CARDS with #21's approve bar on each.
    C  Phase page      the admin's page IS the phase, like the voter's (#27 A): a
                       thin admin strip with ◀ phase ▶ on top, and underneath, the
                       admin's work for that phase — the pool with approve bars in
                       SUGGEST/APPROVE, the ballot and what is not on it in VOTE,
                       PICK's tool in PICK and RUN. The roster is off-phase, a link.

  Fixed by earlier tickets and not up for grabs here: admin surfaces are never
  phase-gated (#15); five phases, four manual transitions, both ways, no deadlines
  (#15 amended); runtime is required to approve and an empty box is the normal
  path (#15); ballot growth clears every done marker (#15); the approve card is the
  shared card plus a runtime input, Approve/Drop and the "differs from TMDB" flag,
  minus the note box (#21 comment); nothing personal-to-anyone on it — no watched
  list, no "3 people watch for this" (#20); roster = view, remove, reset password
  (#8); the floor set is always displayed (#15); the reveal is irreversible and the
  app never claims a reopened vote is unanchored (#8, #15, #29); budget and anchor
  live in PICK's header, not here (#24); admin screens may be utilitarian (map
  principle, #29). PICK and RUN's tools are STAND-INS (#24, #22).

  Data is real (data.js): #27's 32 candidates, nine voters, their notes, scores
  and vetoes, plus the two long films #27 dropped and Iván's stale-tab suggestion
  that lands during APPROVE. Iván never scores (floor 8 of 9); Hanna is part way.

  Round 2 (2026-09-29). Dev: A's tabs win, but the phase control leaves the header
  for a tab of its own that looks like B's console card; click then confirm, to
  survive misclicks; the dense ledger over the shared cards, provided a row opens
  the shared card inline. Also answered: three approve states, undecided stays off
  the ballot; a film dropped mid-VOTE keeps its scores, hidden; one step at a
  time; the voter-cookie hat line is enough. Changes, shown on A only (B and C are
  kept as the losing options, at round 1 apart from the shared roster/card rules):
    - tabs are Phase · Films · Pick · Roster; the header keeps only the hat line.
      The Phase tab is the console card: track with dates, both moves with their
      consequences printed, a "Move to X…" button arming the real one, and the
      three status lines. The tab carries the phase as a badge.
    - a ledger row's title opens the shared card inline, controls staying on the row.
    - removing a voter keeps their suggestions (and pitch), marked "removed";
      their account, scores, vetoes, done marker and other notes go.
    - reset password forces a change at next login.

  Run:  python -m http.server 8028  →  http://localhost:8028/prototypes/admin-console/?variant=A
        (or just open this file — everything is inline)
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Admin console (prototype #28)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {

  header.adm { background:var(--adm); color:#e9ebef; display:flex; gap:14px; align-items:center; padding:8px 18px; position:sticky; top:0; z-index:6; flex-wrap:wrap; }

  header.adm button { background:#353a44; color:#e9ebef; border-color:#4a505c; }

  table.led { width:100%; border-collapse:collapse; background:#fff; border:1px solid var(--line); }

  table.led td { padding:4px 8px; border-bottom:1px solid var(--line2); vertical-align:middle; }
  table.led tr.dropped td { color:#9a978f; } table.led tr.dropped img { opacity:.4; }

  .seg { display:inline-flex; }
  .seg button { border-radius:0; margin-left:-1px; } .seg button:first-child { border-radius:4px 0 0 4px; margin:0; } .seg button:last-child { border-radius:0 4px 4px 0; }
  .seg button.onA { background:var(--ok); color:#fff; border-color:var(--ok); } .seg button.onD { background:#8d8a82; color:#fff; border-color:#8d8a82; }
  .state { font-size:11px; font-weight:600; border-radius:3px; padding:1px 6px; white-space:nowrap; }
  .state.approved { background:var(--ok2); color:var(--ok); } .state.dropped { background:var(--line2); color:var(--mute); } .state.undecided { background:var(--amb2); color:var(--amb); }
  .rt { width:52px; text-align:right; }
  .rt.empty { border-color:var(--warn); background:var(--warn2); }
  .inl { background:var(--acc2); border:1px solid #c9d6f5; border-radius:4px; padding:6px 10px; margin-top:4px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .inl.grave { background:var(--warn2); border-color:#efc5c0; }
  .detail { display:flex; flex-direction:column; gap:6px; }
  .note { display:flex; gap:6px; align-items:baseline; } .note.pitch { font-weight:500; }
  .topics { columns:3 220px; font-size:12px; margin-top:4px; } .topics div { break-inside:avoid; }
  details summary { cursor:pointer; color:var(--mute); }

  /* B */
  header.lite { background:#fff; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:center; padding:8px 18px; position:sticky; top:0; z-index:6; }
  header.lite .brand { font-weight:800; } header.lite .brand small { background:#e9a35c; border-radius:3px; padding:0 5px; font-size:10px; margin-left:6px; letter-spacing:.05em; vertical-align:2px; }

  .pcard { max-width:1100px; background:#fff; border:1px solid var(--line); border-radius:6px; padding:16px 18px; margin:0 0 14px; }

  .track .st .b { width:14px; height:14px; border-radius:50%; border:2px solid var(--line); background:#fff; }
  .track .st.past { color:var(--mute); } .track .st.past .b { background:var(--mute); border-color:var(--mute); }
  .track .st.cur { color:var(--acc); } .track .st.cur .b { background:var(--acc); border-color:var(--acc); box-shadow:0 0 0 4px var(--acc2); }
  .track .st .d { font-weight:400; letter-spacing:0; color:var(--mute); font-size:10px; }
  .track .ln { flex:none; width:40px; height:2px; background:var(--line); margin-top:7px; }

  .move .h { font-weight:700; } .move .acts { margin-top:auto; }
  .move.armed { box-shadow:0 0 0 3px #b9ccf5; } .move.grave.armed { box-shadow:0 0 0 3px #efc5c0; }
  nav.tabs .pbadge { vertical-align:1px; margin-left:4px; }
  .tools { max-width:1100px; background:#fff; border:1px solid var(--line); border-radius:6px; }
  .tools .row { display:flex; gap:14px; align-items:center; padding:10px 14px; border-bottom:1px solid var(--line2); }
  .tools .row:last-child { border-bottom:none; }
  .tools .row .nm { width:90px; font-weight:700; }
  .hat { margin:0 0 14px; color:var(--mute); }

  /* shared card with the approve bar (B, C) */
  .pool { display:flex; flex-direction:column; gap:8px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:10px 12px; display:flex; gap:12px; align-items:flex-start; }
  .card.dropped { opacity:.6; }
  .card img.po { width:52px; height:78px; border-radius:6px; object-fit:cover; background:var(--line2); flex:none; }
  .card .body { flex:1; min-width:0; }
  .card .t1 { display:flex; gap:8px; align-items:baseline; flex-wrap:wrap; }
  .card .t1 .ti { font-size:14px; }
  .card .t2 { display:flex; gap:12px; align-items:center; flex-wrap:wrap; color:var(--mute); font-size:12px; margin-top:2px; }
  .card .notes { margin-top:5px; display:flex; flex-direction:column; gap:2px; }
  .card .more { margin-top:8px; border-top:1px solid var(--line2); padding-top:8px; }
  .abar { width:300px; flex:none; display:flex; flex-direction:column; gap:6px; align-items:flex-end; border-left:1px solid var(--line2); padding-left:12px; }
  .abar .r { display:flex; gap:6px; align-items:center; }
  .sect { margin:18px 0 8px; font-size:13px; font-weight:700; display:flex; gap:10px; align-items:center; }

  /* C */
  .strip { background:var(--adm); color:#e9ebef; display:flex; gap:12px; align-items:center; padding:6px 18px; position:sticky; top:0; z-index:6; flex-wrap:wrap; }
  .strip .brand small { background:#e9a35c; color:#111; border-radius:3px; padding:0 5px; font-size:10px; letter-spacing:.05em; font-weight:800; }
  .strip button { background:#353a44; color:#e9ebef; border-color:#4a505c; }
  .strip .ph { font-weight:800; letter-spacing:.05em; min-width:70px; text-align:center; }
  .strip a { color:#9fbaff; } .strip a.on { color:#fff; font-weight:700; }
  .strip .who { color:#b6bbc6; font-size:12px; }
  .vhead { background:#fff; border-bottom:1px solid var(--line); padding:10px 18px; display:flex; gap:12px; align-items:center; }
  .vhead .big { font-size:15px; font-weight:600; }

  /* roster */
  table.ros { width:100%; border-collapse:collapse; background:#fff; border:1px solid var(--line); }
  table.ros th { text-align:left; font-size:11px; font-weight:600; color:var(--mute); padding:6px 10px; border-bottom:1px solid var(--line); background:#faf9f6; }
  table.ros td { padding:6px 10px; border-bottom:1px solid var(--line2); vertical-align:top; }
  table.ros tr.gone td { color:#a19e96; text-decoration:line-through; }
  .floor { background:#fff; border:1px solid var(--line); border-radius:6px; padding:8px 12px; margin:0 0 10px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  code.pw { font-size:15px; background:#fff; border:1px solid var(--line); padding:2px 8px; border-radius:4px; user-select:all; }

  /* prototype bar */
  .pbar { position:fixed; left:50%; bottom:12px; transform:translateX(-50%); background:#111; color:#eee; border-radius:12px; padding:6px 10px; display:flex; gap:10px; align-items:center; z-index:30; box-shadow:0 6px 24px rgba(0,0,0,.35); font-size:12px; flex-wrap:wrap; justify-content:center; max-width:96vw; }
  .pbar button { background:#2a2a2a; color:#eee; border:1px solid #444; border-radius:6px; padding:2px 8px; font-size:12px; }
  .pbar button.on { background:#eee; color:#111; }
  .pbar .lbl { font-weight:700; min-width:150px; text-align:center; }
  .pbar .grp { display:flex; gap:3px; align-items:center; } .pbar .grp span { color:#999; margin-right:4px; }
</style>

<body>
<div id="app"></div>
<div id="bar"></div>
<script src="data.js"></script>
<script>
const D = window.DATA;
const PHASES = ['SUGGEST', 'APPROVE', 'VOTE', 'PICK', 'RUN'];
const VARIANTS = { A: 'Tabs', B: 'Console page', C: 'Phase page' };
const LATE = 9877, DROPPED = [120, 438631];
const qs = new URLSearchParams(location.search);
const DATES = { SUGGEST: 'Oct 12 · deploy', APPROVE: 'Oct 26', VOTE: 'Oct 28', PICK: 'Nov 6', RUN: 'Nov 8' };
const HUES = { Ana: '#f4c7c3', Bence: '#c6dafc', Csilla: '#fce8b2', Dani: '#b7e1cd', Eszter: '#e1c9f5', Feri: '#f9d4b0', 'Gergő': '#c8e6f0', Hanna: '#f7c6de', 'Iván': '#d9d2c5' };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const po = p => p ? `https://image.tmdb.org/t/p/w185${p}` : '';
const av = n => `<span class="av" style="background:${HUES[n] || '#ddd'}" title="${esc(n)}">${esc(n[0])}</span>`;
const hm = m => `${Math.floor(m / 60)}h ${String(m % 60).padStart(2, '0')}m`;
const clock = m => { const t = (18 * 60 + m) % 1440; return `${String(Math.floor(t / 60)).padStart(2, '0')}:${String(t % 60).padStart(2, '0')}`; };
const WORDS = ['tulip', 'orbit', 'mango', 'cedar', 'pixel', 'otter', 'lemon', 'crane', 'amber', 'fjord', 'basil', 'comet'];

let S;
function preset(p) {
  const i = PHASES.indexOf(p);
  const dec = {};
  if (i === 1) { for (const f of D.films) if (f.order < 20) dec[f.id] = 'approved'; }
  if (i >= 2) { for (const f of D.films) if (f.id !== LATE) dec[f.id] = 'approved'; }
  if (i >= 1) for (const id of DROPPED) dec[id] = 'dropped';
  S = {
    variant: S?.variant || (VARIANTS[qs.get('variant')] ? qs.get('variant') : 'A'),
    voterCookie: S?.voterCookie ?? 'Dani',
    start: p, phase: p,
    log: PHASES.slice(0, i + 1).map(q => ({ p: q, at: DATES[q] })),
    dec, rt: {}, dtddFix: {},
    done: new Set(i >= 2 ? ['Ana', 'Bence', 'Csilla', 'Eszter', 'Feri', 'Gergő'] : []),
    removed: new Set(), temp: {},
    plan: i >= 3 ? [1091, 9552, 26466, 170, 1226578, 431] : [],
    tab: null, route: 'console', cview: 'phase', open: new Set(), filter: 'all', pend: null,
  };
}
preset(PHASES.includes(qs.get('start')) ? qs.get('start') : 'VOTE');

// ---------------------------------------------------------------- the world
const pi = () => PHASES.indexOf(S.phase);
const active = () => D.voters.filter(v => !S.removed.has(v));
const present = () => D.films.filter(f => f.id !== LATE || PHASES.indexOf(S.start) >= 1); // round 2: a removed voter's suggestions stay
const notesOf = f => Object.entries(f.notes).filter(([w]) => w === f.suggester || !S.removed.has(w)).sort((a, b) => (b[0] === f.suggester) - (a[0] === f.suggester));
const sugBy = f => S.removed.has(f.suggester) ? `${av(f.suggester)} <s>${esc(f.suggester)}</s> <span class="mute small">removed</span>` : `${av(f.suggester)} ${esc(f.suggester)}`;
const dec = f => S.dec[f.id] || 'undecided';
const ballot = () => present().filter(f => dec(f) === 'approved');
const rtOf = f => (f.id in S.rt ? S.rt[f.id] : f.runtime);
const everVoted = () => S.log.some(e => e.p === 'VOTE');
const revealedAt = () => (S.log.find(e => e.p === 'PICK') || {}).at;
const scoreOf = (v, id) => everVoted() ? D.scores[v]?.[id] : undefined;
const scored = v => ballot().filter(f => scoreOf(v, f.id) !== undefined).length;
const vetoes = v => everVoted() ? Object.keys(D.vetoes[v] || {}).filter(id => ballot().some(f => f.id == id)).length : 0;
const floorSet = () => active().filter(v => scored(v) > 0);
const doneN = () => active().filter(v => S.done.has(v)).length;
const screen = () => ballot().reduce((a, f) => a + (rtOf(f) || 0), 0);
const notesBy = v => present().reduce((a, f) => a + (f.notes[v] && f.suggester !== v ? 1 : 0), 0);
const title = id => (D.films.find(f => f.id === id) || {}).title;
function planSpan() { let t = 0; for (const id of S.plan) t += (rtOf(D.films.find(f => f.id === id)) || 0) + 15; return t - 15; }

// ---------------------------------------------------------------- phase moves: what each one does, said before it is done
function move(from, to) {
  const nv = active().length, und = present().filter(f => dec(f) === 'undecided'), b = ballot();
  const decided = present().length - und.length, dn = doneN();
  const k = `${from}>${to}`;
  const notDone = active().filter(v => !S.done.has(v)).map(v => `${esc(v)} ${scored(v) ? scored(v) + '/' + b.length : 'nothing scored'}`).join(' · ');
  const M = {
    'SUGGEST>APPROVE': ['Close suggestions', `Voters' list freezes — no more adding, withdrawing or runtime edits; notes stay open. ${present().length} suggestions, ${decided} decided so far.`],
    'APPROVE>SUGGEST': ['Reopen suggestions', `Voters can add, withdraw and correct runtimes again. Your ${decided} decisions are kept.`],
    'APPROVE>VOTE': ['Open the ballot', `<b>${b.length} films</b> (${hm(screen())} screen time) go on ${nv} ballots.${und.length ? ` <b>${und.length} undecided</b> stay off it: ${und.map(f => esc(f.title)).join(', ')}.` : ''}${everVoted() ? ' Scores cast before are kept.' : ''}`],
    'VOTE>APPROVE': ['Close the ballot', `Voters go back to the frozen list. Scores so far are kept and stay hidden; ${dn} done markers stay.`],
    'VOTE>PICK': ['Close VOTE and open the scores', `Every score becomes visible to everyone, by name. <b>${dn} of ${nv} done</b>${notDone ? ` — not done: ${notDone}` : ''}. <b>This can't be taken back:</b> going back to VOTE hides the scores again, but everyone will have seen them.${revealedAt() ? ` (They were already opened once, ${revealedAt()}.)` : ''}`, true],
    'PICK>VOTE': ['Reopen VOTE', `Scores are hidden again. Every ballot comes back with one line: <i>"VOTE was reopened. Scores were open to everyone while it was closed; they're hidden again now."</i> Done markers stay (${dn} of ${nv}).`],
    'PICK>RUN': ['Publish the plan', S.plan.length ? `Everyone's page becomes the evening: <b>${S.plan.length} films, Sat 18:00 → ${clock(planSpan())}</b>. The reveal stays one link away.` : `<b>The timetable is empty</b> — everyone's page becomes an empty evening.`],
    'RUN>PICK': ['Unpublish', `Everyone's page goes back to the reveal. The timetable is kept as it is.`],
  };
  const [btn, text, grave] = M[k];

}

  } else body = pi() === 3 ? pickStandin() : runStandin();
  return `<div class="strip"><span class="brand"><small>ADMIN</small></span>
      ${b ? `<button onclick="askMove('${b.to}')">◀</button>` : '<button disabled>◀</button>'}<span class="ph">${S.phase}</span>${f ? `<button onclick="askMove('${f.to}')">▶</button>` : '<button disabled>▶</button>'}
      <a class="${v === 'phase' ? 'on' : ''}" onclick="S.cview='phase';render()">This phase</a> · <a class="${v === 'roster' ? 'on' : ''}" onclick="S.cview='roster';render()">Roster</a>
      <span class="grow"></span>${voterSide()} <a class="small">Log out</a></div>
    ${confirmStrip()}
    <div class="vhead"><span class="big">${v === 'roster' ? 'Roster' : STAT[S.phase]}</span><span class="grow"></span>${histLine()}</div>
    <main>${body}</main>`;
}

// ---------------------------------------------------------------- plumbing
function tog(id) { S.open.has(id) ? S.open.delete(id) : S.open.add(id); render(); }
function go(r) { S.route = r; S.pend = null; render(); scrollTo(0, 0); }
let tt; function toast(t) { const el = document.createElement('div'); el.textContent = t; el.style.cssText = 'position:fixed;left:50%;bottom:64px;transform:translateX(-50%);background:#1c1b19;color:#fff;border-radius:999px;padding:6px 14px;z-index:40'; document.body.appendChild(el); setTimeout(() => el.remove(), 2500); }
function render() {
  document.getElementById('app').innerHTML = ({ A: variantA, B: variantB, C: variantC })[S.variant]();
  renderBar(); syncUrl();
}
function renderBar() {
  document.getElementById('bar').innerHTML = `<div class="pbar"><button onclick="cycle(-1)">◀</button><span class="lbl">${S.variant} — ${VARIANTS[S.variant]}</span><button onclick="cycle(1)">▶</button>
    <span class="grp"><span>start at</span>${PHASES.map(p => `<button class="${S.start === p ? 'on' : ''}" onclick="restart('${p}')">${p}</button>`).join('')}</span>
    <span class="grp"><span>voter cookie</span><button class="${S.voterCookie ? 'on' : ''}" onclick="S.voterCookie=S.voterCookie?null:'Dani';render()">${S.voterCookie ? 'Dani' : 'none'}</button></span></div>`;
}
function restart(p) { const v = S.variant; preset(p); S.variant = v; render(); }
function syncUrl() { const u = new URL(location); u.searchParams.set('variant', S.variant); u.searchParams.set('start', S.start); history.replaceState(null, '', u); }
function cycle(d) { const k = Object.keys(VARIANTS); S.variant = k[(k.indexOf(S.variant) + d + k.length) % k.length]; S.pend = null; render(); }
document.addEventListener('keydown', e => { if (e.target.closest('input,textarea,[contenteditable]')) return; if (e.key === 'ArrowLeft') cycle(-1); if (e.key === 'ArrowRight') cycle(1); });
render();
</script>
</body>
</html>
