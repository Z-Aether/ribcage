{% extends "base.html" %}

{% block title %}Change password · Ribcage{% endblock %}

{% block content %}
  <h1>Change password</h1>
  <form class="form--short" method="post" action="{% url 'change_password' %}">
    {% csrf_token %}
    {% for field in form %}
      {{ field.as_field_group }}
    {% endfor %}
    <button type="submit">Change password</button>
  </form>
{% endblock %}
