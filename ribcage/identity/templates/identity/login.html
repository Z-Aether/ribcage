{% extends "base.html" %}

{% block title %}Log in · Ribcage{% endblock %}

{% block content %}
  <p class="wordmark">Ribcage</p>
  <h1>Log in</h1>
  <form class="form--short" method="post" action="{% url 'login' %}">
    {% csrf_token %}
    {% for error in form.non_field_errors %}
      <p role="alert">{{ error }}</p>
    {% endfor %}
    {% for field in form %}
      {{ field.as_field_group }}
    {% endfor %}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Log in</button>
  </form>
  <p><a href="{% url 'privacy' %}">Privacy policy</a></p>
{% endblock %}
