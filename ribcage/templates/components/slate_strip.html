<span class="slate-strip">{% for person in row.people %}{% if person.out %}<i class="slate-strip__cell slate-strip__cell--out" title="{{ person.name }}: {{ person.out }}"><span class="visually-hidden">{{ person.name }}: {{ person.out }}</span></i>{% else %}<i class="slate-strip__cell score--{% if person.score >= 3 %}top-pick{% elif person.score == 2 %}keen{% elif person.score == 1 %}happy{% else %}dont-mind{% endif %}" title="{{ person.name }}{% if person.pins %}, pins the floor{% endif %}: {% if person.film %}{{ person.film }}, {{ person.score }}{% else %}nothing on the slate{% endif %}">{{ person.score }}{% if person.pins %}<b class="slate-strip__pin">★</b>{% endif %}</i>{% endif %}{% endfor %}</span>
