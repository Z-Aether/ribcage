{# The reason on the viewer's veto, saved by its own post and answered here so the rest of the card is left as it is (#10, #120, #122). #}
{% with vote=card.vote %}<div class="vote-reason" data-vote-reason>
  <form class="note-box" method="post" action="{% url 'ballot_veto_reason' %}"{% if vote.inert %} onsubmit="return false"{% else %} hx-post="{% url 'ballot_veto_reason' %}" hx-target="closest [data-vote-reason]" hx-swap="outerHTML"{% endif %}>
    {% csrf_token %}
    <input type="hidden" name="suggestion" value="{{ card.suggestion_id|default_if_none:'' }}">
    <input type="hidden" name="card" value="1">
    <label class="note-box__label"><span class="note-box__name">Your reason (optional)</span><textarea name="text" rows="2"{% if vote.refused %} autofocus{% endif %}>{{ vote.reason }}</textarea></label>
    <div class="note-box__foot">
      <button type="submit">Save</button>
      <p class="note-box__said{% if vote.refused %} is-refusal{% endif %}" role="status">{{ vote.said }}</p>
    </div>
  </form>
</div>{% endwith %}
