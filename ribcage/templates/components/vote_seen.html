{# The viewer's seen it on the opened card, a checkbox that waits for the note box's *Save* with the note, in every phase; the tile's own toggle on the ballot is the one that posts at once (#10, #121, #122, #152). #}
{% with vote=card.vote %}<div class="vote-seen">
  <label class="vote-seen__label">{% include "components/vote_toggle.html" with name="seen" id_prefix="vote-seen-" suggestion=card.suggestion_id|default_if_none:"" saved=vote.seen_it shown=vote.shows_seen form_id=card.note_form box_class="" %} Seen it</label>
</div>{% endwith %}
