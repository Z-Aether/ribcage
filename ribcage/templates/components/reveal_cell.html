{# One cell of the reveal: a score as a pill in the ballot's band colours, a veto as ☒, a blank as a dotted pill, and a 👁 on the corner for seen it (#29, #154). Needs `cell`. #}<span class="reveal-pill reveal-pill--{{ cell.key }}" title="{{ cell.meaning }}">{{ cell.sign }}{% if cell.seen_it %}<span class="reveal-pill__seen" aria-label="seen it">👁</span>{% endif %}<span class="visually-hidden">{{ cell.meaning }}</span></span>
