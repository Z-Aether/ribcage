{% load films %}{# The 2:3 poster slot: TMDB's poster, or the title card when the film has none (#38). #}{% if film.poster_path %}<img class="poster poster--{{ size }}" src="{{ film|poster_url:size }}" alt="">{% else %}<span class="poster poster--{{ size }} title-card" data-fill="{{ film|title_card_fill }}"><span class="title-card__title">{{ film.title }}</span>{% if film.year %}<span class="title-card__year">{{ film.year }}</span>{% endif %}</span>{% endif %}
