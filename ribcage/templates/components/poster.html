{% load films %}{# The 2:3 poster slot: TMDB's poster, or the title card when the film has none (#38). Lazy where it sits hidden until opened (#95). #}{% if film.poster_path %}<img class="poster poster--{{ size }}" src="{{ film|poster_url:size }}"{% if lazy %} loading="lazy"{% endif %} alt="">{% else %}<span class="poster poster--{{ size }} title-card"><span class="title-card__title">{{ film.title }}</span>{% if film.year %}<span class="title-card__year">{{ film.year }}</span>{% endif %}</span>{% endif %}
