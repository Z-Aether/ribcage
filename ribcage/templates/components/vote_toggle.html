{# A checkbox that posts with the note box's *Save* rather than at once: the state it sets, the state it was drawn with so a page left open writes only what was changed, and a 0 for the unchecked box, which posts nothing itself. `data-saved` is what `save-waits.js` compares it with (#152). #}
<input type="hidden" name="{{ name }}" value="0"{% if form_id %} form="{{ form_id }}"{% endif %}><input type="hidden" name="{{ name }}_was" value="{% if saved %}1{% else %}0{% endif %}"{% if form_id %} form="{{ form_id }}"{% endif %}><input type="checkbox" class="{{ box_class }}" id="{{ id_prefix }}{{ suggestion }}" name="{{ name }}" value="1" data-saved="{% if saved %}1{% else %}0{% endif %}" autocomplete="off"{% if shown %} checked{% endif %}{% if form_id %} form="{{ form_id }}"{% endif %}>
