{# The viewer's seen it on a tile, at the poster's bottom-right corner; it posts the state it sets, and has no post where `inert` (#10, #121). #}<button type="button" class="seen-toggle{% if seen %} is-on{% endif %}" aria-pressed="{% if seen %}true{% else %}false{% endif %}" aria-label="Seen it" title="Seen it"{% if not inert %} hx-post="{% url 'ballot_seen' %}" hx-vals='{"suggestion": "{{ suggestion_id }}", "seen": "{% if seen %}0{% else %}1{% endif %}"}' hx-swap="none"{% endif %}>👁</button>
